# 站台端覆蓋 NexT 的語言字串（NexT 官方的自訂語言機制，會與主題的語言檔合併）。
# 只放與官方不同的項目，升級主題時不用動。對應說明在 loki-theme.md。
zh-TW:
  # 「歸檔」改叫「文章」：選單文字與歸檔頁的標題都要改，免得兩邊不一致。
  menu:
    archives: 文章
  title:
    archive: 文章
  post:
    # 日期放在前面、說明放在後面（「2026-08-30 發表」），所以拿掉官方的「於」。
    posted: 發表
    edited: 更新
  symbol:
    # 文章資訊列裡多個分類之間的分隔符號，官方是全形逗號（前面會多出一段空隙），改成乘號。
    comma: "×"
